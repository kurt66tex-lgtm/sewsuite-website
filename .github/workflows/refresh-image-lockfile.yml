name: Refresh Sew Suite public-image dependency lock
on:
  push:
    branches:
      - release/public-image-optimization-20261106
    paths:
      - .github/workflows/refresh-image-lockfile.yml
permissions:
  contents: write
jobs:
  lockfile:
    if: github.repository == 'kurt66tex-lgtm/sewsuite-website'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Update dependency lock without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirm lockfile can cleanly install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible lockfile to release branch only
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'LOCKFILE_ALREADY_CURRENT'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Lock Sharp image optimization dependency for reproducible builds'
          git push origin HEAD:release/public-image-optimization-20261106
